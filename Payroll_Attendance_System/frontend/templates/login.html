<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — NovaTech Payroll &amp; Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-3 p-3 mb-2">
                <i class="bi bi-building-check fs-3"></i>
            </div>
            <h4 class="fw-bold mb-1">NovaTech HR Suite</h4>
            <p class="text-muted small mb-0">Payroll &amp; Attendance Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }} py-2 small" role="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <hr class="my-4">
        <div class="bg-light rounded-3 p-3">
            <div class="small fw-semibold text-muted mb-2">Demo Accounts (Seeded in MySQL)</div>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-dark btn-sm text-start"
                        data-demo-user="admin" data-demo-pass="Admin@123">
                    <span class="badge text-bg-primary me-1">HR_ADMIN</span> <code>admin</code> / <code>Admin@123</code>
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start"
                        data-demo-user="aarav.m" data-demo-pass="Employee@123">
                    <span class="badge text-bg-secondary me-1">EMPLOYEE</span> <code>aarav.m</code> / <code>Employee@123</code>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
