{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block page_heading %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card-enterprise p-5 text-center mx-auto" style="max-width: 520px;">
    <div class="display-4 fw-bold text-danger mb-2">{{ code }}</div>
    <h4 class="fw-semibold mb-2">{{ title }}</h4>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
